<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>中文 Stroop 测试</title>
  <style>
    :root{--bg:#eef1f5;--card:#fff;--text:#172033;--muted:#697386;--border:#d9dee8;--soft:#f5f7fa;--dark:#202838;--danger:#c92a2a;--shadow:0 18px 48px rgba(24,32,51,.10)}
    *{box-sizing:border-box} body{min-height:100vh;margin:0;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));color:var(--text);background:radial-gradient(circle at 8% 0%,rgba(49,112,255,.09),transparent 34rem),var(--bg);font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif} button{font:inherit;touch-action:manipulation}.page{width:min(1180px,100%);margin:0 auto}.pageHeader{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:12px}h1,h2,p{margin-top:0}h1{margin-bottom:2px;font-size:clamp(1.6rem,3vw,2.25rem);letter-spacing:-.04em}.subtitle{margin-bottom:0;color:var(--muted);font-size:.94rem}.mainLayout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(270px,.72fr);gap:14px;align-items:stretch}.card{background:rgba(255,255,255,.97);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow)}.leftPanel,.rightPanel,.historyPanel{padding:clamp(14px,2.4vw,24px)}.leftPanel{display:flex;min-height:620px;flex-direction:column}.timerBar{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;margin-bottom:14px;padding:14px 16px;background:var(--soft);border:1px solid var(--border);border-radius:15px}.timerLabel{color:var(--muted);font-size:.82rem}.timerValue{margin-top:1px;font-size:clamp(1.55rem,4vw,2.35rem);font-weight:900;font-variant-numeric:tabular-nums;line-height:1.05}.progressText{color:var(--muted);font-size:.9rem;font-weight:750;white-space:nowrap}.matrixWrap{flex:1;display:grid;place-items:center}.stroopMatrix{width:min(100%,710px);aspect-ratio:1/1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:clamp(5px,1vw,10px);padding:clamp(8px,1.4vw,14px);background:#e9edf3;border:1px solid #cfd6e0;border-radius:18px}.matrixCell{position:relative;display:grid;place-items:center;min-width:0;overflow:hidden;background:#fff;border:2px solid transparent;border-radius:13px;transition:opacity .12s ease,transform .12s ease,border-color .12s ease}.matrixWord{max-width:100%;font-size:clamp(1.6rem,5.3vw,4.7rem);font-weight:950;line-height:1;white-space:nowrap;user-select:none}.matrixCell.current{z-index:1;border-color:#111827;box-shadow:0 0 0 4px rgba(17,24,39,.13);transform:scale(1.035)}.matrixCell.done{opacity:.24}.matrixCell.done::after{content:"✓";position:absolute;right:6px;bottom:3px;color:#253047;font-size:clamp(.7rem,1.7vw,1rem);font-weight:900}.matrixCell.pending{opacity:.84}.rightPanel{display:flex;min-height:620px;flex-direction:column}.rightPanel h2{margin-bottom:4px;font-size:1.25rem}.helpText{margin-bottom:14px;color:var(--muted);font-size:.88rem}.choiceGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.colorButton,.selfCorrectButton,.startButton,.secondaryButton,.deleteButton{cursor:pointer;border-radius:13px;font-weight:850;transition:transform .1s ease,opacity .1s ease,box-shadow .1s ease}.colorButton{min-height:72px;padding:10px 8px;color:var(--text);background:#fff;border:2px solid var(--buttonColor)}.buttonTop{display:flex;align-items:center;justify-content:center;gap:7px}.swatch{width:18px;height:18px;flex:0 0 auto;background:var(--buttonColor);border:1px solid rgba(0,0,0,.25);border-radius:50%}.keyHint{display:block;margin-top:3px;color:var(--muted);font-size:.72rem;font-weight:700}.selfCorrectButton{grid-column:1/-1;min-height:66px;padding:11px;color:#fff;background:#2d6a4f;border:1px solid #2d6a4f;box-shadow:0 8px 20px rgba(45,106,79,.18)}.controls{display:grid;gap:9px;margin-top:auto;padding-top:16px}.startButton{min-height:50px;padding:11px 16px;color:#fff;background:var(--dark);border:1px solid var(--dark)}.secondaryButton{min-height:44px;padding:9px 14px;color:var(--text);background:#fff;border:1px solid var(--border)}button:hover:not(:disabled){transform:translateY(-1px)}button:active:not(:disabled){transform:translateY(0)}button:disabled{cursor:default;opacity:.38}button:focus-visible{outline:3px solid rgba(43,92,216,.28);outline-offset:3px}.resultBox{margin-top:14px;padding:13px;background:var(--soft);border:1px solid var(--border);border-radius:14px}.resultBox.hidden{display:none}.resultTitle{margin-bottom:7px;font-weight:900}.resultStats{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px;color:var(--muted);font-size:.86rem}.resultStats strong{color:var(--text)}.historyPanel{margin-top:14px}.historyHeader{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.historyHeader h2{margin-bottom:0;font-size:1.15rem}.deleteButton{padding:6px 10px;color:var(--danger);background:transparent;border:1px solid rgba(201,42,42,.35);font-size:.8rem}.historyList{display:grid;gap:8px}.historyItem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 12px;background:var(--soft);border:1px solid var(--border);border-radius:12px}.historyDate{font-size:.88rem;font-weight:850}.historyMeta{margin-top:2px;color:var(--muted);font-size:.78rem}.emptyState{padding:22px 10px;color:var(--muted);border:1px dashed var(--border);border-radius:12px;text-align:center}.note{margin:12px 0 0;color:var(--muted);font-size:.75rem;text-align:center}
    @media(max-width:820px){.mainLayout{grid-template-columns:1fr}.leftPanel,.rightPanel{min-height:auto}.rightPanel{display:block}.controls{margin-top:14px}}
    @media(max-width:520px){body{padding-left:7px;padding-right:7px}.leftPanel,.rightPanel,.historyPanel{padding:11px;border-radius:16px}.stroopMatrix{gap:4px;padding:6px;border-radius:13px}.matrixCell{border-radius:8px}.matrixWord{font-size:clamp(1.25rem,10vw,2.5rem)}.timerBar{padding:10px 12px}.colorButton{min-height:58px}}
  </style>
</head>
<body>
  <main class="page">
    <header class="pageHeader"><div><h1>中文 Stroop 测试</h1><p class="subtitle">从左到右、从上到下，依次判断每个字的实际显示颜色。</p></div></header>
    <section class="mainLayout">
      <article class="card leftPanel">
        <div class="timerBar"><div><div class="timerLabel">计时</div><div class="timerValue" id="timerValue">00:00.000</div></div><div class="progressText" id="progressText">未开始 · 0 / 25</div></div>
        <div class="matrixWrap"><div class="stroopMatrix" id="stroopMatrix" aria-label="5乘5 Stroop 颜色矩阵"></div></div>
      </article>
      <aside class="card rightPanel">
        <h2>选择墨水颜色</h2>
        <p class="helpText">点击颜色按钮由系统判断；已自行口头作答且确认正确时，按“我答对了”或数字键 0。</p>
        <div class="choiceGrid" id="choiceGrid"></div>
        <div class="resultBox hidden" id="resultBox"><div class="resultTitle">本次结果</div><div class="resultStats"><span>总用时 <strong id="resultDuration">—</strong></span><span>正确 <strong id="resultCorrect">—</strong></span><span>错误 <strong id="resultWrong">—</strong></span><span>自行确认 <strong id="resultSelf">—</strong></span></div></div>
        <div class="controls"><button class="startButton" id="startButton" type="button">开始测试</button><button class="secondaryButton" id="endButton" type="button" disabled>提前结束</button></div>
      </aside>
    </section>
    <section class="card historyPanel"><div class="historyHeader"><h2>历史记录</h2><button class="deleteButton" id="clearHistoryButton" type="button">全部删除</button></div><div class="historyList" id="historyList"></div></section>
    <p class="note">记录仅保存在当前浏览器中；矩阵每次开始时重新随机生成，25 个项目均为不一致色词。</p>
  </main>
  <script>
    "use strict";
    const storageKey="stroopMatrixHistoryV1";
    const colors=[
      {key:"red",label:"红",hex:"#E53935",keyCode:"1"},{key:"yellow",label:"黄",hex:"#F4C20D",keyCode:"2"},{key:"blue",label:"蓝",hex:"#1E67D6",keyCode:"3"},{key:"green",label:"绿",hex:"#219653",keyCode:"4"},{key:"orange",label:"橙",hex:"#F28C28",keyCode:"5"},{key:"purple",label:"紫",hex:"#8E44AD",keyCode:"6"},{key:"brown",label:"棕",hex:"#8B5A2B",keyCode:"7"},{key:"pink",label:"粉",hex:"#E75480",keyCode:"8"}
    ];
    const elements={matrix:document.getElementById("stroopMatrix"),choiceGrid:document.getElementById("choiceGrid"),timerValue:document.getElementById("timerValue"),progressText:document.getElementById("progressText"),startButton:document.getElementById("startButton"),endButton:document.getElementById("endButton"),resultBox:document.getElementById("resultBox"),resultDuration:document.getElementById("resultDuration"),resultCorrect:document.getElementById("resultCorrect"),resultWrong:document.getElementById("resultWrong"),resultSelf:document.getElementById("resultSelf"),historyList:document.getElementById("historyList"),clearHistoryButton:document.getElementById("clearHistoryButton")};
    let items=[],currentIndex=-1,running=false,startPerformance=0,startDate=null,timerFrameId=0,correctCount=0,wrongCount=0,selfConfirmedCount=0;
    function shuffle(array){const result=[...array];for(let index=result.length-1;index>0;index--){const randomIndex=Math.floor(Math.random()*(index+1));[result[index],result[randomIndex]]=[result[randomIndex],result[index]]}return result}
    function getColor(key){return colors.find(color=>color.key===key)}
    function buildMatrixItems(){const generated=[];let previousInk=null;for(let index=0;index<25;index++){const wordColor=colors[index%colors.length];let possibleInkColors=colors.filter(color=>color.key!==wordColor.key&&color.key!==previousInk);if(possibleInkColors.length===0)possibleInkColors=colors.filter(color=>color.key!==wordColor.key);const inkColor=shuffle(possibleInkColors)[0];previousInk=inkColor.key;generated.push({wordKey:wordColor.key,inkKey:inkColor.key})}return shuffle(generated)}
    function renderMatrix(){elements.matrix.innerHTML="";items.forEach((item,index)=>{const cell=document.createElement("div");cell.className="matrixCell pending";cell.dataset.index=String(index);const word=document.createElement("span");word.className="matrixWord";word.textContent=getColor(item.wordKey).label;word.style.color=getColor(item.inkKey).hex;cell.appendChild(word);elements.matrix.appendChild(cell)});updateMatrixState()}
    function renderChoiceButtons(){elements.choiceGrid.innerHTML="";colors.forEach(color=>{const button=document.createElement("button");button.type="button";button.className="colorButton";button.style.setProperty("--buttonColor",color.hex);button.dataset.colorKey=color.key;button.innerHTML=`<span class="buttonTop"><span class="swatch" aria-hidden="true"></span><span>${color.label}</span></span><span class="keyHint">数字键 ${color.keyCode}</span>`;button.addEventListener("click",()=>answerByColor(color.key));elements.choiceGrid.appendChild(button)});const selfButton=document.createElement("button");selfButton.type="button";selfButton.className="selfCorrectButton";selfButton.innerHTML=`我答对了 <span class="keyHint" style="color:rgba(255,255,255,.78)">数字键 0</span>`;selfButton.addEventListener("click",answerSelfCorrect);elements.choiceGrid.appendChild(selfButton);setAnswerButtonsDisabled(true)}
    function setAnswerButtonsDisabled(disabled){elements.choiceGrid.querySelectorAll("button").forEach(button=>button.disabled=disabled)}
    function updateMatrixState(){elements.matrix.querySelectorAll(".matrixCell").forEach((cell,index)=>{cell.classList.toggle("done",index<currentIndex);cell.classList.toggle("current",running&&index===currentIndex);cell.classList.toggle("pending",running?index>currentIndex:currentIndex<0)})}
    function startTest(){cancelAnimationFrame(timerFrameId);items=buildMatrixItems();currentIndex=0;running=true;correctCount=0;wrongCount=0;selfConfirmedCount=0;startPerformance=performance.now();startDate=new Date();elements.resultBox.classList.add("hidden");elements.startButton.textContent="重新开始";elements.endButton.disabled=false;setAnswerButtonsDisabled(false);renderMatrix();updateProgress();updateTimer()}
    function updateTimer(){if(!running)return;const elapsed=performance.now()-startPerformance;elements.timerValue.textContent=formatTimer(elapsed);timerFrameId=requestAnimationFrame(updateTimer)}
    function answerByColor(colorKey){if(!running||currentIndex<0||currentIndex>=items.length)return;if(items[currentIndex].inkKey===colorKey)correctCount++;else wrongCount++;moveNext()}
    function answerSelfCorrect(){if(!running||currentIndex<0||currentIndex>=items.length)return;correctCount++;selfConfirmedCount++;moveNext()}
    function moveNext(){currentIndex++;if(currentIndex>=items.length){finishTest(false);return}updateMatrixState();updateProgress()}
    function updateProgress(){elements.progressText.textContent=`测试中 · ${Math.max(0,currentIndex)} / 25`}
    function finishTest(endedEarly){if(!running)return;const endPerformance=performance.now(),endDate=new Date(),durationMs=endPerformance-startPerformance,completedCount=Math.min(currentIndex,items.length);running=false;cancelAnimationFrame(timerFrameId);elements.timerValue.textContent=formatTimer(durationMs);elements.progressText.textContent=endedEarly?`已提前结束 · ${completedCount} / 25`:"已完成 · 25 / 25";elements.endButton.disabled=true;setAnswerButtonsDisabled(true);updateMatrixState();elements.resultDuration.textContent=formatDuration(durationMs);elements.resultCorrect.textContent=String(correctCount);elements.resultWrong.textContent=String(wrongCount);elements.resultSelf.textContent=String(selfConfirmedCount);elements.resultBox.classList.remove("hidden");saveHistory({id:`${Date.now()}-${Math.random().toString(16).slice(2)}`,startedAt:startDate.toISOString(),endedAt:endDate.toISOString(),durationMs,completedCount,correctCount,wrongCount,selfConfirmedCount,endedEarly});renderHistory()}
    function formatTimer(milliseconds){const safe=Math.max(0,Math.floor(milliseconds)),totalSeconds=Math.floor(safe/1000),minutes=Math.floor(totalSeconds/60),seconds=totalSeconds%60,millis=safe%1000;return `${String(minutes).padStart(2,"0")}:${String(seconds).padStart(2,"0")}.${String(millis).padStart(3,"0")}`}
    function formatDuration(milliseconds){const safe=Math.max(0,Math.round(milliseconds)),seconds=Math.floor(safe/1000),millis=safe%1000;return `${seconds}.${String(millis).padStart(3,"0")} 秒`}
    function formatDateTime(dateValue){return new Intl.DateTimeFormat("zh-CN",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).format(dateValue)}
    function getHistory(){try{const value=JSON.parse(localStorage.getItem(storageKey)||"[]");return Array.isArray(value)?value:[]}catch{return[]}}
    function setHistory(records){localStorage.setItem(storageKey,JSON.stringify(records))}
    function saveHistory(record){const records=getHistory();records.unshift(record);setHistory(records)}
    function deleteHistory(id){setHistory(getHistory().filter(record=>record.id!==id));renderHistory()}
    function renderHistory(){const records=getHistory();elements.historyList.innerHTML="";elements.clearHistoryButton.disabled=records.length===0;if(records.length===0){const empty=document.createElement("div");empty.className="emptyState";empty.textContent="暂无历史记录";elements.historyList.appendChild(empty);return}records.forEach(record=>{const item=document.createElement("div");item.className="historyItem";const content=document.createElement("div"),date=document.createElement("div"),meta=document.createElement("div");date.className="historyDate";date.textContent=formatDateTime(new Date(record.startedAt));meta.className="historyMeta";meta.textContent=`${formatDuration(record.durationMs)} · ${record.completedCount}/25 项 · 正确 ${record.correctCount} · 错误 ${record.wrongCount} · 自行确认 ${record.selfConfirmedCount}${record.endedEarly?" · 提前结束":""}`;content.append(date,meta);const deleteButton=document.createElement("button");deleteButton.type="button";deleteButton.className="deleteButton";deleteButton.textContent="删除";deleteButton.addEventListener("click",()=>deleteHistory(record.id));item.append(content,deleteButton);elements.historyList.appendChild(item)})}
    document.addEventListener("keydown",event=>{if(!running||event.repeat)return;if(event.key==="0"){event.preventDefault();answerSelfCorrect();return}const selectedColor=colors.find(color=>color.keyCode===event.key);if(selectedColor){event.preventDefault();answerByColor(selectedColor.key)}});
    elements.startButton.addEventListener("click",()=>{if(running&&!window.confirm("当前测试尚未完成，确定重新开始吗？"))return;startTest()});
    elements.endButton.addEventListener("click",()=>{if(running)finishTest(true)});
    elements.clearHistoryButton.addEventListener("click",()=>{if(getHistory().length===0)return;if(window.confirm("确定删除全部历史记录吗？")){setHistory([]);renderHistory()}});
    items=buildMatrixItems();renderMatrix();renderChoiceButtons();renderHistory();
  </script>
</body>
</html>
